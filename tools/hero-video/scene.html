<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Inter'; src: url('../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Brico'; src: url('../../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2') format('woff2'); font-weight: 200 800; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #060b18; font-family: 'Inter', sans-serif; }
  #stage { position: absolute; inset: 0; overflow: hidden;
    background:
      radial-gradient(900px 600px at 68% 58%, rgba(8, 85, 214, .38), transparent 70%),
      radial-gradient(700px 500px at 88% 12%, rgba(120, 90, 255, .20), transparent 70%),
      radial-gradient(800px 700px at 10% 100%, rgba(8, 85, 214, .12), transparent 70%),
      linear-gradient(180deg, #070d1f 0%, #050913 100%); }
  .grid { position: absolute; inset: -200px; opacity: .14;
    background-image: linear-gradient(rgba(255,255,255,.18) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.18) 1px, transparent 1px);
    background-size: 80px 80px; mask-image: radial-gradient(900px 600px at 68% 60%, #000 20%, transparent 75%); }
  .dot { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #9cc0ff; box-shadow: 0 0 12px #5b8fff; }
  #world { position: absolute; left: 1300px; top: 600px; perspective: 1800px; }
  #rig { position: absolute; transform-style: preserve-3d; }
  .floor { position: absolute; left: -420px; top: 250px; width: 840px; height: 160px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(8,85,214,.55), rgba(8,85,214,0)); filter: blur(10px); }
  /* stand */
  #stand { position: absolute; left: -170px; top: -260px; width: 340px; height: 470px; transform-style: preserve-3d; }
  .acrylic { position: absolute; inset: 0; border-radius: 28px;
    background: linear-gradient(140deg, rgba(255,255,255,.28), rgba(255,255,255,.06) 40%, rgba(255,255,255,.14));
    border: 1px solid rgba(255,255,255,.35); box-shadow: 0 40px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.6); }
  .card { position: absolute; inset: 16px; border-radius: 18px; background: #fbfbfd; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; padding: 34px 26px 22px; }
  .gbar { position: absolute; top: 0; left: 0; right: 0; height: 8px; background: linear-gradient(90deg,#4285F4 0 25%,#EA4335 25% 50%,#FBBC05 50% 75%,#34A853 75%); }
  .card h3 { font-family: 'Brico'; font-weight: 750; font-size: 34px; line-height: 1.02; color: #0b1430; text-align: center; letter-spacing: -.5px; margin-top: 8px; }
  .card p { font-size: 15px; color: #5a6380; margin-top: 10px; text-align: center; }
  .stars { display: flex; gap: 6px; margin-top: 18px; }
  .stars svg { width: 30px; height: 30px; }
  .nfc { margin-top: 26px; width: 108px; height: 108px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle, #eef3ff, #dfe8ff); border: 2px dashed #8fb0f5; }
  .brand { margin-top: auto; display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: 1.5px; font-size: 15px; color: #0f2347; }
  .base { position: absolute; left: -10px; right: -10px; bottom: -34px; height: 46px; border-radius: 10px;
    background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,.08)); border: 1px solid rgba(255,255,255,.3); transform: rotateX(70deg); transform-origin: top; }
  /* ripples */
  .ring { position: absolute; left: 50%; top: 50%; border-radius: 50%; border: 3px solid #6aa0ff; transform: translate(-50%,-50%); box-shadow: 0 0 30px rgba(90,150,255,.6), inset 0 0 30px rgba(90,150,255,.35); }
  /* phone */
  #phone { position: absolute; width: 300px; height: 620px; left: -150px; top: -310px; border-radius: 52px; background: #0d0f14;
    box-shadow: 0 0 0 2px #2a2f3a, 0 0 0 9px #11141b, 0 50px 120px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.08); }
  #screen { position: absolute; inset: 12px; border-radius: 42px; overflow: hidden; background: #0b1120; }
  .island { position: absolute; top: 14px; left: 50%; width: 96px; height: 28px; margin-left: -48px; border-radius: 20px; background: #000; z-index: 5; }
  #lock { position: absolute; inset: 0; background: radial-gradient(400px 400px at 30% 20%, #2a4dbb, transparent 60%), radial-gradient(400px 400px at 80% 90%, #6b3bd6, transparent 60%), #0b1120; color: #fff; text-align: center; }
  #lock .time { font-family: 'Brico'; font-size: 86px; font-weight: 600; margin-top: 92px; letter-spacing: -2px; }
  #lock .date { font-size: 17px; opacity: .8; margin-top: 2px; }
  #lock .hint { position: absolute; bottom: 70px; left: 0; right: 0; font-size: 15px; opacity: .75; }
  #app { position: absolute; inset: 0; background: #fff; color: #1f1f1f; padding: 70px 22px 0; }
  .appbar { display: flex; align-items: center; gap: 10px; font-size: 15px; color: #444; }
  .g { width: 34px; height: 34px; border-radius: 50%; background: conic-gradient(#EA4335 0 25%, #FBBC05 0 50%, #34A853 0 75%, #4285F4 0); display: grid; place-items: center; }
  .g span { width: 18px; height: 18px; border-radius: 50%; background: #fff; }
  .biz { margin-top: 26px; font-family: 'Brico'; font-weight: 700; font-size: 28px; color: #111; }
  .sub { font-size: 14px; color: #666; margin-top: 4px; }
  .avatar { display: flex; align-items: center; gap: 10px; margin-top: 26px; font-size: 14px; color: #333; }
  .avatar i { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg,#0855d6,#7c5cff); display: block; }
  .bigstars { display: flex; gap: 8px; margin-top: 22px; }
  .bigstars svg { width: 40px; height: 40px; }
  .field { margin-top: 22px; height: 110px; border: 1.5px solid #dadce0; border-radius: 12px; padding: 12px; font-size: 14px; color: #333; }
  .post { margin-top: 18px; height: 46px; border-radius: 23px; background: #1a73e8; color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 15px; }
  #toast { position: absolute; left: 18px; right: 18px; bottom: 30px; height: 64px; border-radius: 18px; background: #0f2347; color: #fff; display: flex; align-items: center; gap: 12px; padding: 0 16px; font-size: 15px; font-weight: 600; }
  #toast b { width: 30px; height: 30px; border-radius: 50%; background: #22c55e; display: grid; place-items: center; }
  .glare { position: absolute; inset: 0; border-radius: 52px; background: linear-gradient(115deg, rgba(255,255,255,.16), transparent 35%); pointer-events: none; }
  /* floating chips */
  .chip { position: absolute; padding: 14px 20px; border-radius: 18px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(14px); color: #fff; font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .chip em { font-style: normal; color: #ffd166; }
</style>
</head>
<body>
<div id="stage">
  <div class="grid" id="grid"></div>
  <div id="dots"></div>
  <div id="world">
    <div id="rig">
      <div class="floor"></div>
      <div id="ripples"></div>
      <div id="stand">
        <div class="acrylic"></div>
        <div class="card">
          <div class="gbar"></div>
          <h3>Loved your<br/>visit?</h3>
          <p>Tap your phone here to leave<br/>us a Google review</p>
          <div class="stars" id="cardStars"></div>
          <div class="nfc">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#0855d6" stroke-width="1.8" stroke-linecap="round"><path d="M6 8.32a7.43 7.43 0 0 1 0 7.36"/><path d="M9.46 6.21a11.76 11.76 0 0 1 0 11.58"/><path d="M12.91 4.1a15.91 15.91 0 0 1 .01 15.8"/><path d="M16.37 2a20.16 20.16 0 0 1 0 20"/></svg>
          </div>
          <div class="brand">
            <svg width="22" height="22" viewBox="0 0 40 40"><circle cx="9" cy="9" r="7" fill="#0f2347"/><circle cx="31" cy="9" r="7" fill="#0f2347"/><circle cx="9" cy="31" r="7" fill="#0f2347"/><circle cx="31" cy="31" r="7" fill="#0855d6"/><rect x="15.5" y="15.5" width="9" height="9" rx="1.5" transform="rotate(45 20 20)" fill="#0f2347"/></svg>
            TAPILLY
          </div>
        </div>
        <div class="base"></div>
      </div>
      <div id="phone">
        <div id="screen">
          <div class="island"></div>
          <div id="app">
            <div class="appbar"><div class="g"><span></span></div> Google Reviews</div>
            <div class="biz">The Daily Bites</div>
            <div class="sub">Restaurant · Beirut</div>
            <div class="avatar"><i></i> Posting publicly</div>
            <div class="bigstars" id="bigStars"></div>
            <div class="field" id="field"></div>
            <div class="post">Post</div>
            <div id="toast"><b>✓</b> Review posted — thank you!</div>
          </div>
          <div id="lock"><div class="time">5:18</div><div class="date">Tuesday, 21 October</div><div class="hint">Hold near a Tapilly tag</div></div>
        </div>
        <div class="glare"></div>
      </div>
    </div>
  </div>
  <div class="chip" id="chip1">★ <em>4.9</em> Google rating</div>
  <div class="chip" id="chip2">⚡ No app needed</div>
  <div class="chip" id="chip3">+38 reviews this month</div>
</div>
<script>
  const STAR = (fill) => `<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6L2.5 9.4l6.6-.8z" fill="${fill}"/></svg>`;
  document.getElementById('cardStars').innerHTML = Array(5).fill(STAR('#FBBC05')).join('');
  const dotsEl = document.getElementById('dots');
  const DOTS = Array.from({ length: 46 }, (_, i) => {
    const d = document.createElement('div'); d.className = 'dot'; dotsEl.appendChild(d);
    const r = (n) => { const x = Math.sin(i * 999 + n * 77.7) * 43758.5453; return x - Math.floor(x); };
    return { el: d, x: r(1) * 1920, y: r(2) * 1080, a: 10 + r(3) * 40, p: r(4), s: .4 + r(5) * .9 };
  });
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const seg = (t, a, b) => ease(clamp((t - a) / (b - a)));
  const lerp = (a, b, k) => a + (b - a) * k;
  const D = 8;
  const REVIEW = 'Amazing food and super friendly staff. Will definitely come back!';

  window.render = (time) => {
    const t = time % D, w = (Math.PI * 2 * t) / D;
    // camera drift (seamless)
    $('rig').style.transform = `rotateY(${-16 + Math.sin(w) * 6}deg) rotateX(${6 + Math.cos(w) * 2}deg)`;
    $('grid').style.transform = `translate(${Math.sin(w) * 20}px, ${-t * 10 % 80}px)`;
    for (const d of DOTS) {
      const k = (t / D + d.p) % 1;
      d.el.style.transform = `translate(${d.x + Math.sin(w + d.p * 6) * d.a}px, ${d.y - k * 260}px)`;
      d.el.style.opacity = (Math.sin(k * Math.PI) * d.s).toFixed(3);
    }
    // phone path: enter 0.3-1.7, tap 1.7-2.2, hold, lift 4.9-5.6, exit 5.9-7.2
    const enter = seg(t, .3, 1.7), tap = seg(t, 1.7, 2.15), lift = seg(t, 4.9, 5.6), exit = seg(t, 5.9, 7.3);
    let x = lerp(820, 230, enter), y = lerp(-520, -250, enter), z = lerp(-200, 120, enter), rz = lerp(28, 12, enter), ry = lerp(-40, -22, enter), rx = 18;
    x = lerp(x, 120, tap); y = lerp(y, -150, tap); z = lerp(z, 220, tap); rz = lerp(rz, 6, tap); rx = lerp(rx, 34, tap);
    x = lerp(x, 250, lift); y = lerp(y, -230, lift); z = lerp(z, 160, lift); rx = lerp(rx, 10, lift); rz = lerp(rz, 2, lift); ry = lerp(ry, -14, lift);
    x = lerp(x, 820, exit); y = lerp(y, -520, exit); z = lerp(z, -200, exit); rz = lerp(rz, 28, exit); ry = lerp(ry, -40, exit); rx = lerp(rx, 18, exit);
    const bob = Math.sin(t * 3.1) * 6 * (1 - tap + lift);
    $('phone').style.transform = `translate3d(${x}px, ${y + bob}px, ${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`;
    $('phone').style.opacity = (1 - seg(t, 6.9, 7.3)) * seg(t, .3, .7);
    // screen state
    const appIn = seg(t, 2.2, 2.6);
    $('lock').style.opacity = 1 - appIn;
    $('app').style.transform = `translateY(${(1 - appIn) * 40}px)`;
    const filled = Math.floor(clamp((t - 2.7) / .22, 0, 5));
    $('bigStars').innerHTML = Array.from({ length: 5 }, (_, i) => STAR(i < filled ? '#FBBC05' : '#e3e5e8')).join('');
    const chars = Math.floor(clamp((t - 3.8) / 1.0) * REVIEW.length);
    $('field').textContent = REVIEW.slice(0, chars) + (t > 3.8 && t < 4.9 && Math.floor(t * 4) % 2 ? '|' : '');
    const toast = seg(t, 4.9, 5.2) * (1 - seg(t, 6.6, 6.9));
    $('toast').style.opacity = toast; $('toast').style.transform = `translateY(${(1 - toast) * 30}px)`;
    // ripples from 2.1
    let rings = '';
    for (let i = 0; i < 4; i++) {
      const k = clamp((t - 2.1 - i * .28) / 1.5);
      if (k > 0 && k < 1) rings += `<div class="ring" style="width:${120 + k * 620}px;height:${120 + k * 620}px;opacity:${(1 - k) * .9};transform:translate(-50%,-50%) translate3d(0,-30px,10px)"></div>`;
    }
    $('ripples').innerHTML = rings;
    $('stand').style.filter = `drop-shadow(0 0 ${lerp(0, 50, seg(t, 2.1, 2.4) * (1 - seg(t, 3.4, 4.2)))}px rgba(90,150,255,.8))`;
    // chips
    const chip = (id, a, b, cx, cy) => { const k = seg(t, a, a + .6) * (1 - seg(t, b, b + .6)); const el = $(id);
      el.style.opacity = k; el.style.left = cx + 'px'; el.style.top = cy + Math.sin(w * 2 + a) * 10 + (1 - k) * 24 + 'px'; };
    chip('chip1', 3.0, 6.8, 1560, 300);
    chip('chip2', 1.0, 6.6, 860, 730);
    chip('chip3', 5.0, 7.2, 1540, 790);
  };
  window.render(0);
</script>
</body>
</html>
